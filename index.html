<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고용증대 세액공제 계산기 (개정 버전)</title>
    <!-- React and TailwindCSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const INQUIRY_STORAGE_KEY = 'starrich-inquiries-v1';
        const GOOGLE_SCRIPT_WEB_APP_URL = '';
        const initialInquiryForm = {
          name: '',
          phone: '',
          email: '',
          message: '',
          consent: false,
        };

        /*
         * 계산기 컴포넌트
         * - 만 15~29세 청년 정규직을 15~34세로 수정합니다.
         * - 기준년도를 선택하는 옵션을 제거하고, 2025년 이전 기준과 2026년 이후 기준 두 가지 금액표를 동시에 표시합니다.
         * - 표는 4행(각 기준별 기본/우대 2행씩)으로 구성하며, 왼쪽 첫 열을 기준명으로 병합해 표시합니다.
         * - 연도별 세액공제 계산 시 1차년도는 해당 연도의 기준을 적용하고, 2차/3차년도 추가공제는 최초 공제연도의 기준을 그대로 사용합니다.
         */


        const Calculator = () => {
          // 상태 변수 정의
          const [companyType, setCompanyType] = useState('small');
          const [location, setLocation] = useState('capital');
          const [baseYear, setBaseYear] = useState('2024');
          const [endYear, setEndYear] = useState(''); // 데이터 마지막년도(선택)
          const [yearlyData, setYearlyData] = useState({});
          const [results, setResults] = useState(null);
          const [inquiryForm, setInquiryForm] = useState(initialInquiryForm);
          const [inquiryEntries, setInquiryEntries] = useState([]);
          const [inquiryStatus, setInquiryStatus] = useState({ type: '', message: '' });
          const [isSubmittingInquiry, setIsSubmittingInquiry] = useState(false);

          // 선택한 시작연도를 기준으로 5개 연도 배열 생성 (시작년도부터 +4년까지)
          const yearRange = useMemo(() => {
            const start = parseInt(baseYear);
            const end = endYear ? parseInt(endYear) : (start + 4);
            const safeEnd = isNaN(end) ? (start + 4) : Math.max(end, start);
            const years = [];
            for (let y = start; y <= safeEnd; y++) years.push(y);
            return years;
          }, [baseYear, endYear]);

                    // 선택한 데이터 시작년도 기준으로, 표에 보여줄 기준(2022/2025/2026)을 계산합니다.
          // 예) 2024 시작이면 [2024~2028]에 포함되는 기준은 2025/2026 이므로 2022는 숨깁니다.
                    // 데이터 시작년도(baseYear) 기준으로, 표에 보여줄 기준(2022/2025/2026)을 계산합니다.
          // 요구사항:
          //  - 시작년도 ≤ 2022 : 2022/2025/2026 모두 표시
          //  - 시작년도 2023~2025 : 2025/2026 표시
          //  - 시작년도 ≥ 2026 : 2026만 표시
          const visibleBaselines = useMemo(() => {
            const y = parseInt(baseYear);
            if (y <= 2022) return new Set(['2022', '2025', '2026']);
            if (y <= 2025) return new Set(['2025', '2026']);
            return new Set(['2026']);
          }, [baseYear, endYear]);

// 연도별 데이터 초기화
          useEffect(() => {
            const newData = {};
            yearRange.forEach((year) => {
              newData[year] = yearlyData[year] || { total: 0, basic: 0, premium: 0 };
            });
            setYearlyData(newData);
          }, [baseYear, endYear]);

          useEffect(() => {
            try {
              const savedEntries = JSON.parse(localStorage.getItem(INQUIRY_STORAGE_KEY) || '[]');
              if (Array.isArray(savedEntries)) {
                setInquiryEntries(savedEntries);
              }
            } catch (error) {
              console.error('상담신청 데이터 로드 실패', error);
            }
          }, []);

          // 기준 판단 함수: 연도가 2025년 이하면 '2025' (이전 기준), 그렇지 않으면 '2026' (이후 기준)
          function getBaselineByYear(year) {
            const y = parseInt(year);
            if (y <= 2022) return '2022';
            if (y <= 2025) return '2025';
            return '2026';
          }

          // 공제금액 결정 함수
          // baseline: '2025' 또는 '2026' (2026은 2026년 이후 기준)
          const getCreditAmount = (type, loc, isPremium, yearIndex, baseline) => {
            // 2022년 이전 기준 (1차~3차) 금액
            if (baseline === '2022') {
              if (type === 'small') {
                if (loc === 'capital') {
                  if (isPremium) {
                    // 중소기업(3년) 수도권 우대 1100/1100/1100
                    return [1100, 1100, 1100][yearIndex - 1] || 1100;
                  } else {
                    // 중소기업(3년) 수도권 기본 700/700/700
                    return [700, 700, 700][yearIndex - 1] || 700;
                  }
                } else {
                  // 지방 (수도권 외)
                  if (isPremium) {
                    // 중소기업(3년) 지방 우대 1200/1200/1200
                    return [1200, 1200, 1200][yearIndex - 1] || 1200;
                  } else {
                    // 중소기업(3년) 지방 기본 770/770/770
                    return [770, 770, 770][yearIndex - 1] || 770;
                  }
                }
              } else if (type === 'medium') {
                // 중견기업(3년) 수도권/지방 공통
                if (isPremium) {
                  // 우대 800/800/800
                  return [800, 800, 800][yearIndex - 1] || 800;
                } else {
                  // 기본 450/450/450
                  return [450, 450, 450][yearIndex - 1] || 450;
                }
              } else {
                // 대기업(2년 공제)
                if (isPremium) {
                  // 우대 400/400/0
                  return [400, 400, 0][yearIndex - 1] || 0;
                } else {
                  return 0;
                }
              }
            }

            if (baseline === '2026') {
              // 2026년 이후 기준 (1차~3차) 금액
              if (type === 'small') {
                if (loc === 'capital') {
                  if (isPremium) {
                    // 일반 정규직 우대: 수도권 우대 700/1600/1700
                    return [700, 1600, 1700][yearIndex - 1] || 1700;
                  } else {
                    // 청년·고령·장애 등 기본: 수도권 기본 400/900/1000
                    return [400, 900, 1000][yearIndex - 1] || 1000;
                  }
                } else {
                  // 지방 (수도권 외)
                  if (isPremium) {
                    // 일반 정규직 우대: 지방 우대 1000/1900/2000
                    return [1000, 1900, 2000][yearIndex - 1] || 2000;
                  } else {
                    // 청년·고령·장애 등 기본: 지방 기본 700/1200/1300
                    return [700, 1200, 1300][yearIndex - 1] || 1300;
                  }
                }
              } else if (type === 'medium') {
                // 중견기업
                if (isPremium) {
                  // 일반 정규직 우대: 500/900/900
                  return [500, 900, 900][yearIndex - 1] || 900;
                } else {
                  // 청년·고령·장애 등 기본: 300/500/500
                  return [300, 500, 500][yearIndex - 1] || 500;
                }
              } else {
                // 대기업
                if (isPremium) {
                  // 일반 정규직 우대: 300/500/0
                  return [300, 500, 0][yearIndex - 1] || 0;
                } else {
                  // 대기업 기본은 0 (세액공제 없음)
                  return 0;
                }
              }
            } else {
              // 2025년 이전 기준 (1차~3차) 금액
              if (type === 'small') {
                if (loc === 'capital') {
                  if (isPremium) {
                    // 수도권 우대 1450/1450/1450
                    return [1450, 1450, 1450][yearIndex - 1] || 1450;
                  } else {
                    // 수도권 기본 850/850/850
                    return [850, 850, 850][yearIndex - 1] || 850;
                  }
                } else {
                  if (isPremium) {
                    // 지방 우대 1550/1550/1550
                    return [1550, 1550, 1550][yearIndex - 1] || 1550;
                  } else {
                    // 지방 기본 950/950/950
                    return [950, 950, 950][yearIndex - 1] || 950;
                  }
                }
              } else if (type === 'medium') {
                if (isPremium) {
                  // 중견 우대 800/800/800
                  return [800, 800, 800][yearIndex - 1] || 800;
                } else {
                  // 중견 기본 450/450/450
                  return [450, 450, 450][yearIndex - 1] || 450;
                }
              } else {
                // 대기업
                if (isPremium) {
                  // 대기업 우대 400/400/0
                  return [400, 400, 0][yearIndex - 1] || 0;
                } else {
                  // 대기업 기본 0
                  return 0;
                }
              }
            }
          };

          // 입력값 변경 처리
          // 기본(일반 정규직) 또는 우대(청년·고령·장애) 값을 수정하면 전체(total)를 자동으로 계산합니다.
          const handleDataChange = (year, field, value) => {
            setYearlyData((prev) => {
              const newYearData = { ...prev[year], [field]: parseFloat(value) || 0 };
              // premium: 기본(일반 정규직), basic: 우대(청년·고령·장애)
              if (field === 'premium' || field === 'basic') {
                const premiumVal = field === 'premium' ? parseFloat(value) || 0 : parseFloat(newYearData.premium) || 0;
                const basicVal = field === 'basic' ? parseFloat(value) || 0 : parseFloat(newYearData.basic) || 0;
                newYearData.total = parseFloat((premiumVal + basicVal).toFixed(2));
              }
              return {
                ...prev,
                [year]: newYearData,
              };
            });
          };

          // 총공제 및 추징 합계 계산 함수
          const getTotalCredit = () => (results ? results.reduce((s, r) => s + r.totalCredit, 0) : 0);
          const getTotalPenalty = () => (results ? results.reduce((s, r) => s + r.penalty, 0) : 0);
          const getNetCredit = () => getTotalCredit() - getTotalPenalty();

          // 결과를 연도별로 그룹화하여 동일 연도의 행을 병합하기 위한 데이터 구조를 생성합니다.
          const groupedResults = useMemo(() => {
            const groups = {};
            if (results && Array.isArray(results)) {
              results.forEach((r) => {
                if (!groups[r.year]) groups[r.year] = [];
                groups[r.year].push(r);
              });
            }
            return groups;
          }, [results]);

          // 연도별(표시 연도)로 행의 배경색을 지정하기 위한 매핑을 만듭니다.
          // 같은 기준년도(baseYear) 그룹의 1/2/3차 공제행은 항상 동일한 색으로 보이도록 합니다.
          // 기존 구현에서는 results 배열 순서에 따라 색상이 지정되어 일부 행에서 동일한 baseYear임에도 다른 색을 가지는 문제가 있었습니다.
          // 아래 로직에서는 results에서 baseYear(없으면 year)를 추출하여 고유값을 정렬한 뒤 색상을 매핑합니다.
          const yearColorMap = useMemo(() => {
            const colors = [
              'bg-yellow-50',
              'bg-blue-50',
              'bg-green-50',
              'bg-purple-50',
              'bg-pink-50',
              'bg-indigo-50',
              'bg-teal-50',
              'bg-orange-50',
            ];
            const map = {};
            if (results && Array.isArray(results)) {
              // 수집한 키를 정렬하여 순서에 따라 색상 할당
              const keys = Array.from(
                new Set(results.map((r) => (r.baseYear || r.year)))
              ).sort();
              keys.forEach((key, idx) => {
                map[key] = colors[idx % colors.length];
              });
            }
            return map;
          }, [results]);


          // 현재 적용 중인 금액표: 2025년 이전 기준과 2026년 이후 기준 두 세트
                    const currentRates2022 = useMemo(() => {
            const locKey = location === 'capital' ? 'capital' : 'nonCapital';
            return {
              year1Basic: getCreditAmount(companyType, locKey, false, 1, '2022'),
              year1Premium: getCreditAmount(companyType, locKey, true, 1, '2022'),
              year2Basic: getCreditAmount(companyType, locKey, false, 2, '2022'),
              year2Premium: getCreditAmount(companyType, locKey, true, 2, '2022'),
              year3Basic: getCreditAmount(companyType, locKey, false, 3, '2022'),
              year3Premium: getCreditAmount(companyType, locKey, true, 3, '2022'),
            };
          }, [companyType, location]);

const currentRates2025 = useMemo(() => {
            const locKey = location === 'capital' ? 'capital' : 'nonCapital';
            return {
              year1Basic: getCreditAmount(companyType, locKey, false, 1, '2025'),
              year1Premium: getCreditAmount(companyType, locKey, true, 1, '2025'),
              year2Basic: getCreditAmount(companyType, locKey, false, 2, '2025'),
              year2Premium: getCreditAmount(companyType, locKey, true, 2, '2025'),
              year3Basic: getCreditAmount(companyType, locKey, false, 3, '2025'),
              year3Premium: getCreditAmount(companyType, locKey, true, 3, '2025'),
            };
          }, [companyType, location]);

          const currentRates2026 = useMemo(() => {
            const locKey = location === 'capital' ? 'capital' : 'nonCapital';
            return {
              year1Basic: getCreditAmount(companyType, locKey, false, 1, '2026'),
              year1Premium: getCreditAmount(companyType, locKey, true, 1, '2026'),
              year2Basic: getCreditAmount(companyType, locKey, false, 2, '2026'),
              year2Premium: getCreditAmount(companyType, locKey, true, 2, '2026'),
              year3Basic: getCreditAmount(companyType, locKey, false, 3, '2026'),
              year3Premium: getCreditAmount(companyType, locKey, true, 3, '2026'),
            };
          }, [companyType, location]);

          // 세액공제 계산 함수
          const calculateCredit = () => {
            // (재계산) 버튼 클릭마다 결과를 새로 계산합니다
            setResults(null);
            // 연도 목록을 가져오고 입력값이 모두 0인 마지막 행 이후는 제외합니다
            const allYears = Object.keys(yearlyData).sort((a,b)=>parseInt(a)-parseInt(b));
            let lastNonZeroIndex = allYears.length - 1;
            for (let i = allYears.length - 1; i >= 0; i--) {
              const y = allYears[i];
              const d = yearlyData[y] || { total: 0, basic: 0, premium: 0 };
              // 입력한 연도까지만 계산: 전체, 기본, 우대 값이 하나라도 0이 아닌 경우 마지막 인덱스로 설정
              if (d.total !== 0 || d.basic !== 0 || d.premium !== 0) {
                lastNonZeroIndex = i;
                break;
              }
            }
            // trimmedYears는 입력이 있는 연도까지만 포함합니다
            const years = allYears.slice(0, lastNonZeroIndex + 1);

            const calculationResults = [];
            // 연도별 증감을 저장하여 동일 연도 행에서 동일 값을 표시하기 위한 맵
            const yearDiffMap = {};
            years.forEach((y, idx) => {
              if (idx === 0) return;
              const prevYear = years[idx - 1];
              const currData = yearlyData[y];
              const prevData = yearlyData[prevYear];
              const totalDiff = currData.total - prevData.total;
              const generalDiff = currData.premium - prevData.premium;
              const specialDiff = currData.basic - prevData.basic;
              yearDiffMap[y] = { total: totalDiff, general: generalDiff, special: specialDiff };
            });

            const initialCreditYears = {};
            const locKey = location === 'capital' ? 'capital' : 'nonCapital';

            years.forEach((year, index) => {
              // 첫 해(예: 2024)는 기준값이 없으므로 세액공제를 계산하지 않습니다
              if (index === 0) return;

              const curr = yearlyData[year];
              const prev = yearlyData[years[index - 1]];
              const totalInc = curr.total - prev.total;
              const basicInc = curr.basic - prev.basic;
              const premiumInc = curr.premium - prev.premium;

              // 해당 연도의 기준 설정 (1차년도 공제)
              const baseline = getBaselineByYear(year);
              const bRate = getCreditAmount(companyType, locKey, false, 1, baseline);
              const pRate = getCreditAmount(companyType, locKey, true, 1, baseline);

              if (totalInc > 0) {
                // basicInc: 우대(청년·고령·장애 등) 근로자 증가분, premiumInc: 기본(일반 정규직) 증가분
                // 1차년도 공제에서 기본증감은 기본(일반 정규직) 근로자 증가분, 우대증감은 우대(청년·고령·장애 등) 근로자 증가분으로 표시합니다.
                const bCnt = Math.min(Math.max(0, basicInc), totalInc);
                const pCnt = Math.min(Math.max(0, premiumInc), totalInc - bCnt);
                // credit amounts: bCnt represents the increase of special employees (우대),
                // pCnt represents the increase of general employees (기본).
                // General employees earn the basic credit (bRate), and special employees earn the premium credit (pRate).
                const bCredit = bCnt * pRate;
                const pCredit = pCnt * bRate;

                initialCreditYears[year] = {
                  baseline,
                  totalEmployees: curr.total,
                  basicEmployees: curr.basic,
                  premiumEmployees: curr.premium,
                  // basicCreditCount holds the general increase (pCnt), premiumCreditCount holds the special increase (bCnt)
                  basicCreditCount: pCnt,
                  premiumCreditCount: bCnt,
                  // basicCredit: credit earned by general employees, premiumCredit: credit earned by special employees
                  basicCredit: pCredit,
                  premiumCredit: bCredit,
                  totalCredit: bCredit + pCredit,
                  // basicRate corresponds to the general credit (lower), premiumRate corresponds to the special credit (higher)
                  basicRate: bRate,
                  premiumRate: pRate,
                  creditByOffset: { 0: bCredit + pCredit },
                };

                // 표시용 숫자는 소수 둘째 자리까지 표기
                const bCntDisplay = parseFloat(bCnt).toFixed(2); // special employees
                const pCntDisplay = parseFloat(pCnt).toFixed(2); // general employees
                // 기본: 일반 정규직(pCnt) × basicRate, 우대: 청년·고령·장애 등(bCnt) × premiumRate
                const formula =
                  '기본 ' +
                  pCntDisplay +
                  '명 × ' +
                  bRate +
                  '만원 + 우대 ' +
                  bCntDisplay +
                  '명 × ' +
                  pRate +
                  '만원 = ' +
                  (bCredit + pCredit).toLocaleString() +
                  '만원';

                calculationResults.push({
                  year,
                  baseYear: year,
                  type: '1차년도 공제',
                  totalIncrease: totalInc,
                  // 기본증감: 기본(일반 정규직) 근로자 증가분, 우대증감: 우대(청년·고령·장애 등) 근로자 증가분
                  basicIncrease: premiumInc,
                  premiumIncrease: basicInc,
                  // For credit counts: basicCreditCount holds general employees, premiumCreditCount holds special employees
                  basicCreditCount: pCnt,
                  premiumCreditCount: bCnt,
                  basicCredit: pCredit,
                  premiumCredit: bCredit,
                  totalCredit: bCredit + pCredit,
                  penalty: 0,
                  description: '전년 대비 상시근로자 증가',
                  formula,
                });
              } else {
                // (추가) 1차년도 공제금액이 0이어도, 해당 연도를 '공제 시작년도'로 등록하여
                // 다음 해(2차), 그 다음 해(3차) 행이 누락되지 않도록 합니다.
                // (예: 2025년에 공제액 0이어도, 2026년에 2차년도 추가공제(2025년분) 행 표시)
                initialCreditYears[year] = {
                  baseline,
                  totalEmployees: curr.total,
                  basicEmployees: curr.basic,
                  premiumEmployees: curr.premium,
                  basicCreditCount: 0,
                  premiumCreditCount: 0,
                  basicCredit: 0,
                  premiumCredit: 0,
                  totalCredit: 0,
                  basicRate: bRate,
                  premiumRate: pRate,
                  // 증가분이 없으므로 최초 공제액은 0원으로 기록합니다.
                  creditByOffset: { 0: 0 },
                };

                calculationResults.push({
                  year,
                  baseYear: year,
                  type: '1차년도 공제',
                  totalIncrease: totalInc,
                  // 기본증감: 기본(일반 정규직) 근로자 증가분, 우대증감: 우대(청년·고령·장애 등) 근로자 증가분
                  basicIncrease: premiumInc,
                  premiumIncrease: basicInc,
                  basicCreditCount: 0,
                  premiumCreditCount: 0,
                  basicCredit: 0,
                  premiumCredit: 0,
                  totalCredit: 0,
                  penalty: 0,
                  description: '전년 대비 미증가 (공제불가)',
                  formula: '증가 없음',
                });
              }

              // 추가 공제 계산 (2차, 3차년도)
              const additionalYears = companyType === 'large' ? 1 : 2;
              for (let addYear = 1; addYear <= additionalYears; addYear++) {
                const futureIndex = index + addYear;
                if (futureIndex >= years.length) break;

                const futureYearKey = years[futureIndex];
                const futureYearData = yearlyData[futureYearKey];

                Object.keys(initialCreditYears).forEach((initialYear) => {
                  const initialData = initialCreditYears[initialYear];
                  const yearsSinceInitial = parseInt(futureYearKey) - parseInt(initialYear);

                  if (yearsSinceInitial !== addYear) return;

                  // 최초 공제연도의 기준을 그대로 사용
                  const baselineInitial = initialData.baseline;
                  const bRateNext = getCreditAmount(companyType, locKey, false, addYear + 1, baselineInitial);
                  const pRateNext = getCreditAmount(companyType, locKey, true, addYear + 1, baselineInitial);

                  // ✅ 2026년 이후 기준: "추징(감소)"만 제외 (공제 계산 로직은 동일)
                  const noPenalty = parseInt(baselineInitial, 10) >= 2026;

                  // 직전 1년/2년 이내 "실제로 공제받은" 횟수/합계 (추징 한도 적용)
                  const creditByOffset = initialData.creditByOffset || {};
                  const prevOffsets = Object.keys(creditByOffset)
                    .map((v) => parseInt(v, 10))
                    .filter((o) => o < addYear && creditByOffset[o] > 0);

                  const creditCount = prevOffsets.length;
                  const creditSum = prevOffsets.reduce((acc, o) => acc + (creditByOffset[o] || 0), 0);

                  const totalChange = futureYearData.total - initialData.totalEmployees;
                  const specialChange = futureYearData.basic - initialData.basicEmployees;   // 우대(청년등) 증감
                  const generalChange = futureYearData.premium - initialData.premiumEmployees; // 기본(청년등 외) 증감

                  let additionalCredit = 0;
                  let penalty = 0;
                  let description = '';
                  let formula = '';

                  // =========================
                  // (A) 전체 상시근로자 감소
                  // =========================
                  if (totalChange < 0) {
                    description = noPenalty ? '전체 감소 (2026년 이후 기준: 추징 없음)' : '전체 감소 (공제불가+추징)';
                    additionalCredit = 0;

                    if (noPenalty || creditCount === 0) {
                      penalty = 0;
                      formula = noPenalty ? '2026년 이후 기준: 인원 감소 추징 없음' : '직전 기간 공제 이력 없음';
                    } else {
                      const tDec = Math.abs(totalChange);
                      const sDec = Math.max(0, initialData.basicEmployees - futureYearData.basic);      // 우대 감소
                      const gDec = Math.max(0, initialData.premiumEmployees - futureYearData.premium); // 기본 감소

                      // ❶/❹ : 우대 감소 ≥ 전체 감소
                      if (sDec >= tDec) {
                        const sLimit = Math.min(sDec, initialData.premiumCreditCount); // 최초 우대 증가 한도
                        const excess = Math.max(0, sLimit - tDec);
                        const rateDiff = initialData.premiumRate - initialData.basicRate;

                        const raw = (excess * rateDiff + tDec * initialData.premiumRate) * creditCount;
                        penalty = Math.min(raw, creditSum);

                        const excessDisp = parseFloat(excess).toFixed(2);
                        const tDecDisp = parseFloat(tDec).toFixed(2);
                        formula =
                          '추징: [{' +
                          excessDisp +
                          '명 × (' +
                          rateDiff +
                          ')만원} + {' +
                          tDecDisp +
                          '명 × ' +
                          initialData.premiumRate +
                          '만원}] × ' +
                          creditCount +
                          '회 (한도 ' +
                          creditSum.toLocaleString() +
                          '만원) = ' +
                          penalty.toLocaleString() +
                          '만원';
                      } else {
                        // ❷/❺ : 그 밖의 경우(우대 감소 < 전체 감소)
                        const partS = Math.min(sDec, tDec);
                        const partG = Math.min(gDec, tDec - partS);

                        const raw = (partS * initialData.premiumRate + partG * initialData.basicRate) * creditCount;
                        penalty = Math.min(raw, creditSum);

                        const partSDisp = parseFloat(partS).toFixed(2);
                        const partGDisp = parseFloat(partG).toFixed(2);
                        formula =
                          '추징: [{' +
                          partSDisp +
                          '명 × ' +
                          initialData.premiumRate +
                          '만원} + {' +
                          partGDisp +
                          '명 × ' +
                          initialData.basicRate +
                          '만원}] × ' +
                          creditCount +
                          '회 (한도 ' +
                          creditSum.toLocaleString() +
                          '만원) = ' +
                          penalty.toLocaleString() +
                          '만원';
                      }
                    }
                  }
                  // =========================
                  // (B) 전체는 유지/증가, 우대(청년등)만 감소
                  // =========================
                  else if (specialChange < 0) {
                    description = noPenalty
                      ? '우대 감소 (2026년 이후 기준: 추징 없음)'
                      : '우대 감소 (기본으로 재계산)';

                    // 📌 우대가 줄어든 만큼 "청년등 외"로 본다. 법령상 감소한 우대 인원은 모두
                    // 일반 근로자로 간주하여 가장 낮은 단가를 적용해야 합니다. 일부 환경에서
                    // getCreditAmount 의 isPremium 매핑이 바뀌면서 bRateNext 가 우대 단가를 반환하는
                    // 경우를 방지하기 위해 bRateNext 와 pRateNext 중 더 낮은 값을 사용합니다.
                    const allCnt = initialData.basicCreditCount + initialData.premiumCreditCount;
                    const minRateNext = Math.min(bRateNext, pRateNext);
                    additionalCredit = allCnt * minRateNext;

                    // 우대 감소 추징(우대-기본 차액) : min(우대감소, 최초우대증가) × (우대-기본) × 공제횟수, 한도=직전기간 공제액 합계
                    if (noPenalty || creditCount === 0) {
                      penalty = 0;
                      formula = `공제: ${parseFloat(allCnt).toFixed(2)}명 × ${minRateNext}만원 = ${additionalCredit.toLocaleString()}만원` +
                        (noPenalty ? '\n추징: 0만원 (2026년 이후 기준)' : '\n추징: 0만원 (직전 공제 이력 없음)');
                    } else {
                      const sDecLimit = Math.min(Math.abs(specialChange), initialData.premiumCreditCount);
                      const rateDiff = initialData.premiumRate - initialData.basicRate;
                      const raw = sDecLimit * rateDiff * creditCount;
                      penalty = Math.min(raw, creditSum);

                      formula =
                        `공제: ${parseFloat(allCnt).toFixed(2)}명 × ${minRateNext}만원 = ${additionalCredit.toLocaleString()}만원\n` +
                        `추징: ${parseFloat(sDecLimit).toFixed(2)}명 × (${rateDiff})만원 × ${creditCount}회 (한도 ${creditSum.toLocaleString()}만원) = ${penalty.toLocaleString()}만원`;
                    }
                  }
                  // =========================
                  // (C) 고용 유지/증가
                  // =========================
                  else {
                    description = '고용 유지/증가';
                    additionalCredit = initialData.basicCreditCount * bRateNext + initialData.premiumCreditCount * pRateNext;

                    formula =
                      '기본 ' +
                      parseFloat(initialData.basicCreditCount).toFixed(2) +
                      '명 × ' +
                      bRateNext +
                      '만원 + 우대 ' +
                      parseFloat(initialData.premiumCreditCount).toFixed(2) +
                      '명 × ' +
                      pRateNext +
                      '만원 = ' +
                      additionalCredit.toLocaleString() +
                      '만원';
                  }

                  // ✅ 공제 이력 저장(추징 횟수/한도 계산용)
                  if (!initialData.creditByOffset) initialData.creditByOffset = {};
                  initialData.creditByOffset[addYear] = additionalCredit > 0 ? additionalCredit : 0;

                  // 결과 저장(표시용)
                  const outBasicCnt =
                    totalChange < 0 ? 0 :
                      (specialChange < 0 ? (initialData.basicCreditCount + initialData.premiumCreditCount) : initialData.basicCreditCount);

                  const outPremCnt =
                    totalChange < 0 ? 0 :
                      (specialChange < 0 ? 0 : initialData.premiumCreditCount);

                  const outBasicCredit =
                    totalChange < 0 ? 0 :
                      // 우대 감소 시 모두 가장 낮은 단가(min(bRateNext, pRateNext))를 적용해 표시합니다.
                      (specialChange < 0 ? outBasicCnt * Math.min(bRateNext, pRateNext) : initialData.basicCreditCount * bRateNext);

                  const outPremCredit =
                    totalChange < 0 ? 0 :
                      (specialChange < 0 ? 0 : initialData.premiumCreditCount * pRateNext);

                  calculationResults.push({
                    year: futureYearKey,
                    type: `${addYear + 1}차년도 추가공제 (${initialYear}년분)`,
                    totalIncrease: totalChange,
                    basicIncrease: generalChange,
                    premiumIncrease: specialChange,
                    basicCreditCount: outBasicCnt,
                    premiumCreditCount: outPremCnt,
                    basicCredit: outBasicCredit,
                    premiumCredit: outPremCredit,
                    totalCredit: additionalCredit,
                    penalty,
                    description,
                    baseYear: initialYear,
                    formula,
                  });
                });
              }
            // 연도 asc, 차년도 공제 종류 순서
            // 각 행에 대해 증감값을 설정합니다.
            // 1차년도 공제는 해당 연도의 증감값을 사용하고, 추가공제는 기준년도(최초 공제연도)의 증감값을 사용합니다.
            calculationResults.forEach((res) => {
              // 기준년도(baseYear)가 없으면 현재 연도를 기준년도으로 설정합니다.
              if (!res.baseYear) {
                res.baseYear = res.year;
              }
              // 모든 행은 동일 연도의 증감값을 사용합니다. (같은 연도 행에 대해 증감은 같은 값)
              const diffSourceYear = res.year;
              if (yearDiffMap[diffSourceYear]) {
                const diffs = yearDiffMap[diffSourceYear];
                res.totalIncrease = diffs.total;
                // basicIncrease는 일반 정규직(premium) 근로자 증가분, premiumIncrease는 우대(basic) 근로자 증가분입니다.
                res.basicIncrease = diffs.general;
                res.premiumIncrease = diffs.special;
              }
              // baseline 구분 (2025/2026 등) : 추가 공제인 경우 baseYear를, 아니면 해당 연도를 사용
              const baselineYearForRow = res.type.includes('추가') ? res.baseYear : res.year;
              res.baseline = getBaselineByYear(baselineYearForRow);
            });

            });

            const sorted = [...calculationResults].sort((a, b) => {
              if (a.year !== b.year) return parseInt(a.year) - parseInt(b.year);
              return a.type.localeCompare(b.type);
            });
            setResults(sorted);
            // 📌 계산 결과가 설정되면 결과 영역으로 스크롤합니다.
            // React의 상태 업데이트 이후에 DOM이 렌더링되도록 0ms 지연을 두어 실행합니다.
            setTimeout(() => {
              const el = document.getElementById('resultSection');
              if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
              }
            }, 0);
          };

          // CSV 내보내기
          const exportCSV = () => {
            if (!results) return;
            let csv = '\uFEFF고용증대 세액공제 계산 결과\n\n';
            csv += `기업유형,${companyType === 'small' ? '중소기업' : companyType === 'medium' ? '중견기업' : '대기업'}\n`;
            csv += `소재지,${location === 'capital' ? '수도권' : '지방(수도권 외)'}\n`;
            csv += '\n입력 데이터\n연도,전체,기본(일반정규직),우대(청년고령장애)\n';
            Object.keys(yearlyData).forEach((y) => {
              const d = yearlyData[y];
              // premium = 기본(일반 정규직), basic = 우대(청년·고령·장애)
              csv += `${y},${d.total},${d.premium},${d.basic}\n`;
            });
            csv += '\n계산 결과\n';
            // 결과 CSV 헤더: "기준년도"로 표기하여 하이픈 대신 값을 채워줍니다.
            csv += '연도,구분,기준년도,상태,전체증감,기본증감,우대증감,기본공제인원,우대공제인원,기본공제액,우대공제액,총공제액,추징세액,계산식\n';
            results.forEach((r) => {
              csv += `${r.year},"${r.type}",${r.baseYear || ''},"${r.description}",`;
              csv += `${r.totalIncrease},${r.basicIncrease},${r.premiumIncrease},`;
              csv += `${r.basicCreditCount},${r.premiumCreditCount},`;
              csv += `${r.basicCredit},${r.premiumCredit},${r.totalCredit},${r.penalty},"${r.formula.replace(/\n/g, ' | ')}"\n`;
            });
            csv += '\n요약\n';
            csv += `총 공제액,${getTotalCredit().toLocaleString()}만원\n`;
            csv += `총 추징세액,${getTotalPenalty().toLocaleString()}만원\n`;
            csv += `순 공제액,${getNetCredit().toLocaleString()}만원\n`;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `고용증대세액공제_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          // 엑셀 입력 템플릿 다운로드
          const downloadTemplate = () => {
            let csv = '\uFEFF고용증대 세액공제 입력 템플릿\n\n';
            csv += '연도,전체,기본(일반정규직),우대(청년고령장애)\n';
            yearRange.forEach((y) => {
              csv += `${y},0,0,0\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '입력템플릿.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          const handleInquiryChange = (e) => {
            const { name, value, type, checked } = e.target;
            setInquiryForm((prev) => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value,
            }));
          };

          const handleInquirySubmit = async (e) => {
            e.preventDefault();

            const trimmedForm = {
              name: inquiryForm.name.trim(),
              phone: inquiryForm.phone.trim(),
              email: inquiryForm.email.trim(),
              message: inquiryForm.message.trim(),
              consent: inquiryForm.consent,
            };

            if (!trimmedForm.name || !trimmedForm.phone || !trimmedForm.email || !trimmedForm.message) {
              setInquiryStatus({
                type: 'error',
                message: '성명, 연락처, 이메일, 상담내용을 모두 입력해 주세요.',
              });
              return;
            }

            if (!trimmedForm.consent) {
              setInquiryStatus({
                type: 'error',
                message: '개인정보 수집 및 이용 동의가 필요합니다.',
              });
              return;
            }

            const payload = {
              id: Date.now(),
              consultant: '양금주 상무',
              submittedAt: new Date().toISOString(),
              ...trimmedForm,
            };

            setIsSubmittingInquiry(true);

            try {
              if (GOOGLE_SCRIPT_WEB_APP_URL) {
                const response = await fetch(GOOGLE_SCRIPT_WEB_APP_URL, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                  },
                  body: JSON.stringify(payload),
                });

                const result = await response.json();
                if (!response.ok || result.result !== 'success') {
                  throw new Error(result.message || 'Drive CSV 저장 실패');
                }
              }

              const nextEntries = [payload, ...inquiryEntries];
              localStorage.setItem(INQUIRY_STORAGE_KEY, JSON.stringify(nextEntries));
              setInquiryEntries(nextEntries);
              setInquiryForm(initialInquiryForm);
              setInquiryStatus({
                type: 'success',
                message: GOOGLE_SCRIPT_WEB_APP_URL
                  ? '상담신청이 저장되었습니다. Drive 폴더의 CSV와 이 브라우저 목록에 반영되었습니다.'
                  : '상담신청이 저장되었습니다. 현재는 웹앱 URL이 비어 있어 이 브라우저에만 저장되었습니다.',
              });
            } catch (error) {
              console.error('상담신청 데이터 저장 실패', error);
              setInquiryStatus({
                type: 'error',
                message: error.message || '상담신청 저장 중 오류가 발생했습니다.',
              });
            } finally {
              setIsSubmittingInquiry(false);
            }
          };

          const exportInquiryCSV = () => {
            if (!inquiryEntries.length) {
              setInquiryStatus({
                type: 'error',
                message: '다운로드할 상담신청 데이터가 없습니다.',
              });
              return;
            }

            let csv = '\uFEFF접수일시,담당자,성명,연락처,이메일,상담내용,개인정보동의\n';
            inquiryEntries.forEach((entry) => {
              const safeMessage = entry.message.replace(/\n/g, ' ').replace(/"/g, '""');
              csv += `${entry.submittedAt},${entry.consultant},${entry.name},${entry.phone},${entry.email},"${safeMessage}",${entry.consent ? '동의' : '미동의'}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `상담신청_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 p-4">
              <div className="max-w-7xl mx-auto">
                {/* 제목 */}
                <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">🧮 고용증대 세액공제 자동 계산기</h1>
                  <p className="text-gray-600">조세특례제한법 제29조의7 개정 반영</p>
                </div>

                {/* 설정 영역 */}
                <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                  <h2 className="text-xl font-bold mb-4">⚙️ 설정</h2>
                  
                  <div className="grid md:grid-cols-2 gap-4 mb-4">
                    <div>
                      <label className="block text-sm font-medium mb-2">데이터 시작년도</label>
                      <select
                        value={baseYear}
                        onChange={(e) => setBaseYear(e.target.value)}
                        className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                      >
                        {[
                          2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026,
                          2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035,
                        ].map((y) => (
                          <option key={y} value={y}>
                            {y}년
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">&nbsp;</label>
                      <select
                        value={endYear}
                        onChange={(e) => setEndYear(e.target.value)}
                        className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="">데이터 마지막년도(선택)</option>
                        {[
                          2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026,

                            <label className="mb-2 block text-sm font-semibold text-slate-700">연락처</label>
                            <input
                              type="tel"
                              name="phone"
                              value={inquiryForm.phone}
                              onChange={handleInquiryChange}
                              className="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                              placeholder="010-0000-0000"
                            />
                          </div>
                          <div>
                            <label className="mb-2 block text-sm font-semibold text-slate-700">이메일</label>
                            <input
                              type="email"
                              name="email"
                              value={inquiryForm.email}
                              onChange={handleInquiryChange}
                              className="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                              placeholder="name@example.com"
                            />
                          </div>
                        </div>
                        <div>
                          <label className="mb-2 block text-sm font-semibold text-slate-700">상담내용</label>
                          <textarea
                            name="message"
                            value={inquiryForm.message}
                            onChange={handleInquiryChange}
                            rows="6"
                            className="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                            placeholder="필요한 상담 내용을 자세히 남겨 주세요"
                          />
                        </div>
                        <label className="flex items-start gap-3 rounded-2xl bg-slate-50 px-4 py-4 text-sm text-slate-700">
                          <input
                            type="checkbox"
                            name="consent"
                            checked={inquiryForm.consent}
                            onChange={handleInquiryChange}
                            className="mt-1 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                          />
                          <span>개인정보 수집 및 이용에 동의합니다. 수집 항목은 성명, 연락처, 이메일, 상담내용이며 상담 응대 목적으로 Drive 폴더의 CSV와 이 브라우저에 저장될 수 있습니다.</span>
                        </label>

                        {inquiryStatus.message && (
                          <div
                            className={
                              inquiryStatus.type === 'success'
                                ? 'rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700'
                                : 'rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700'
                            }
                          >
                            {inquiryStatus.message}
                          </div>
                        )}

                        <div className="flex flex-col gap-3 sm:flex-row">
                          <button
                            type="submit"
                            disabled={isSubmittingInquiry}
                            className="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300"
                          >
                            {isSubmittingInquiry ? '저장 중...' : '상담신청 저장'}
                          </button>
                          <button
                            type="button"
                            onClick={exportInquiryCSV}
                            className="inline-flex items-center justify-center rounded-xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
                          >
                            신청데이터 CSV 다운로드
                          </button>
                        </div>
                      </form>

                      {inquiryEntries.length > 0 && (
                        <div className="mt-6 rounded-2xl border border-slate-200">
                          <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">
                            <p className="text-sm font-semibold text-slate-800">최근 접수 내역</p>
                            <p className="text-xs text-slate-500">같은 브라우저 기준</p>
                          </div>
                          <div className="max-h-72 overflow-auto">
                            <table className="w-full min-w-[640px] text-left text-sm">
                              <thead className="bg-slate-50 text-slate-600">
                                <tr>
                                  <th className="px-4 py-3 font-semibold">접수일시</th>
                                  <th className="px-4 py-3 font-semibold">성명</th>
                                  <th className="px-4 py-3 font-semibold">연락처</th>
                                  <th className="px-4 py-3 font-semibold">이메일</th>
                                  <th className="px-4 py-3 font-semibold">상담내용</th>
                                </tr>
                              </thead>
                              <tbody>
                                {inquiryEntries.map((entry) => (
                                  <tr key={entry.id} className="border-t border-slate-100 align-top text-slate-700">
                                    <td className="px-4 py-3 whitespace-nowrap">{new Date(entry.submittedAt).toLocaleString('ko-KR')}</td>
                                    <td className="px-4 py-3 font-medium">{entry.name}</td>
                                    <td className="px-4 py-3">{entry.phone}</td>
                                    <td className="px-4 py-3">{entry.email}</td>
                                    <td className="px-4 py-3 whitespace-pre-line">{entry.message}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="mt-8 rounded-2xl border border-slate-200 bg-white px-6 py-5 shadow-sm">
                      <div className="flex flex-col items-center justify-between gap-4 text-center md:flex-row md:text-left">
                        <div>
                          <p className="text-sm font-semibold tracking-[0.2em] text-slate-500">PARTNER</p>
                          <p className="mt-2 text-lg font-bold text-slate-900">스타리치어드바이져</p>
                          <p className="mt-1 text-sm text-slate-600">스타리치어드바이져 공식 사이트와 양금주 상무 상담신청 페이지를 함께 참고할 수 있습니다.</p>
                        </div>
                        <a
                          href="https://www.starrich.co.kr/community/inquiry?ceg_id=250306C000001&cnstnt_nm=%EC%96%91%EA%B8%88%EC%A3%BC&cnstnt_ofc=%EC%83%81%EB%AC%B4"
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex items-center justify-center rounded-xl border border-slate-200 bg-slate-50 px-5 py-4 transition hover:border-slate-300 hover:bg-slate-100"
                        >
                          <img
                            src="https://www.starrich.co.kr/skin/image/logo_201221.png"
                            alt="스타리치어드바이져 로고"
                            className="h-10 w-auto"
                          />
                        </a>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<Calculator />, document.getElementById('root'));
    </script>
</body>
</html>
